
# --- Shell settings ---

shell nu

# --- Cursor settings ---

cursor_trail 3
cursor_trail_decay 0.1 0.2

# --- Font settings ---

font_family ComicShannsMono Nerd Font
font_size   12.0
modify_font cell_width 103%

# --- Keymaps ---

# Scroll with ctrl + shift + u / ctrl + shift + d
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down

# Launch new window in current cwd with ctrl + alt + enter
map ctrl+alt+enter launch --cwd=current --type=os-window

